# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

include: ["_pages"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - FAQ.md
  - INSTALL.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - lighthouse_results/
  - readme_preview/
  - vendor/
  - .bundle/
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll/scholar
  - jekyll-sitemap

collections:
  news:
    output: false

# -----------------------------------------------------------------------------
# Jekyll Scholar (publications are generated from _bibliography/papers.bib)
# -----------------------------------------------------------------------------
scholar:
  last_name: [Lin]
  first_name: [Lu]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibliography_group_tag: h3
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: false

  query: "@*"
  group_by: year
  group_order: descending
